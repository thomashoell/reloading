name: CI

on:
  # pushes to main run this pipeline through release.yml (workflow_call)
  # develop is the integration branch until the first release: check the merged state as well
  push:
    branches:
      - develop
  pull_request:
  # weekly run so new CVEs in dependencies are detected even without commits
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # the release workflow runs the full pipeline before publishing
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # single source of truth for the linter version: .pre-commit-config.yaml (updated by Dependabot)
      - name: Read actionlint version from .pre-commit-config.yaml
        id: versions
        run: |
          actionlint=$(awk 'index($0, "repo: https://github.com/rhysd/actionlint") { found = 1; next } found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml)
          if [ -z "$actionlint" ]; then
            echo "::error file=.pre-commit-config.yaml::could not read the actionlint version"
            exit 1
          fi
          echo "actionlint=${actionlint#v}" >> "$GITHUB_OUTPUT"

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # the tests start PostgreSQL 18 with Testcontainers (Docker is available on the runner)
      - name: Build and test
        run: ./mvnw verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 7

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # the CodeQL action reads the workflow run (otherwise "Resource not accessible by integration")
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          # analyses the sources without a Maven build
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
