name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release derives the next version from the Conventional Commits since the last tag,
#    updates CHANGELOG.md, pushes the release commit + tag and creates the GitHub release.
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
#    All writes use the GitHub App thomashoell-release-bot, the only actor allowed to bypass the main ruleset.
# 3. the jar (+ SHA-256) is attached to the release, with a build provenance attestation
#    (verify with `gh attestation verify reloading-<version>.jar --owner thomashoell`).
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: '25'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token, which may bypass the branch protection of main
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release authenticates git pushes with GITHUB_TOKEN itself
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install semantic-release
        run: npm ci --ignore-scripts

      - name: Get bot identity for the release commit
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}

  jar:
    name: Jar
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # tested by the CI job above
      - name: Build jar
        run: |
          ./mvnw package -DskipTests -Drevision="${VERSION}"
          mkdir dist
          cp target/reloading.jar "dist/reloading-${VERSION}.jar"
          (cd dist && sha256sum ./*.jar > checksums.txt)

      - name: Attest build provenance of the jar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.jar

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/* -R "$GITHUB_REPOSITORY" --clobber
