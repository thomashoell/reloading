databaseChangeLog:
  - changeSet:
      id: 20260216-1135-create-case
      author: tho

      changes:
        - createTable:
            tableName: bullet_casing
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: "uuidv7()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: manufacturer
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_manufacturer
                    referencedTableName: manufacturer
                    referencedColumnNames: id
              - column:
                  name: caliber
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_case_caliber
                    referencedTableName: caliber
                    referencedColumnNames: id
              - column:
                  name: lot_number
                  type: text
        - addUniqueConstraint:
            tableName: bullet_casing
            columnNames: manufacturer, lot_number
            constraintName: uk_case_manufacturer_lot_number
            validate: true
        - sql:
            sql: "ALTER TABLE bullet_casing ALTER COLUMN lot_number TYPE text COLLATE case_insensitive;"
