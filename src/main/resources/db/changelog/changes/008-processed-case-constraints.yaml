databaseChangeLog:
  - changeSet:
      id: 20261114-1000-calibration-implicit-cast
      author: tho

      changes:
        - sql:
            comment: "Spring Data JDBC binds enums as varchar; let PostgreSQL cast them to the native enum type"
            sql: "CREATE CAST (varchar AS calibration) WITH INOUT AS IMPLICIT;"

  - changeSet:
      id: 20261114-1005-processed-case-check-constraints
      author: tho

      changes:
        - sql:
            comment: "explicit, named check constraints; 'IS NOT TRUE' also covers NULL (= unknown)"
            sql: >
              ALTER TABLE processed_case
                ADD CONSTRAINT ck_processed_case_fired_from
                  CHECK (is_fired IS NOT TRUE OR fired_from IS NOT NULL),
                ADD CONSTRAINT ck_processed_case_calibration_die
                  CHECK (calibration_method IS NULL OR calibration_die IS NOT NULL),
                ADD CONSTRAINT ck_processed_case_mandrel_diameter
                  CHECK (mandrel_used IS NOT TRUE OR mandrel_diameter IS NOT NULL);
