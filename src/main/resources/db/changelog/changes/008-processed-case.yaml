# a batch of cases of one lot that were prepared the same way
# user data: every row belongs to one user (owner) and is only visible to that user
# measures are stored in SI base units: lengths in m, masses in kg, velocities in m/s, temperatures in K
databaseChangeLog:
  - changeSet:
      id: 20260224-1501-create-processed-case
      author: tho

      changes:
        - createTable:
            tableName: processed_case
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: "uuidv7()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_processed_case_owner
                    referencedTableName: app_user
                    referencedColumnNames: id
              - column:
                  name: casing_lot
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: processed_on
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: times_fired
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: fired_from
                  type: uuid
              - column:
                  name: is_trimmed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: case_length
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: calibration_method
                  type: calibration
              - column:
                  name: calibration_die
                  type: text
              - column:
                  name: bushing
                  type: text
              - column:
                  name: mandrel_used
                  type: boolean
              - column:
                  name: mandrel_diameter
                  type: numeric
        - addUniqueConstraint:
            tableName: processed_case
            columnNames: id, owner
            constraintName: uk_processed_case_id_owner
            validate: true
        - sql:
            comment: "the referenced rows must belong to the same owner"
            sql: >
              ALTER TABLE processed_case
                ADD CONSTRAINT fk_processed_case_casing_lot
                  FOREIGN KEY (casing_lot, owner) REFERENCES casing_lot (id, owner),
                ADD CONSTRAINT fk_processed_case_rifle
                  FOREIGN KEY (fired_from, owner) REFERENCES rifle (id, owner);
        - sql:
            sql: >
              ALTER TABLE processed_case
                ADD CONSTRAINT ck_processed_case_quantity
                  CHECK (quantity > 0),
                ADD CONSTRAINT ck_processed_case_times_fired
                  CHECK (times_fired >= 0),
                ADD CONSTRAINT ck_processed_case_fired_from
                  CHECK (times_fired = 0 OR fired_from IS NOT NULL),
                ADD CONSTRAINT ck_processed_case_case_length
                  CHECK (case_length > 0),
                ADD CONSTRAINT ck_processed_case_calibration_die
                  CHECK (calibration_method IS NULL OR calibration_die IS NOT NULL),
                ADD CONSTRAINT ck_processed_case_mandrel_diameter
                  CHECK (mandrel_used IS NOT TRUE OR mandrel_diameter IS NOT NULL),
                ADD CONSTRAINT ck_processed_case_mandrel_diameter_positive
                  CHECK (mandrel_diameter > 0);
