# a batch of cartridges loaded with the same components and the same data
# user data: every row belongs to one user (owner) and is only visible to that user
# measures are stored in SI base units: lengths in m, masses in kg, velocities in m/s, temperatures in K
databaseChangeLog:
  - changeSet:
      id: 20261114-1110-create-load
      author: tho

      changes:
        - createTable:
            tableName: load
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: "uuidv7()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_load_owner
                    referencedTableName: app_user
                    referencedColumnNames: id
              - column:
                  name: processed_case
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: bullet_lot
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: powder_lot
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: primer_lot
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: powder_charge
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: overall_length
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: base_to_ogive
                  type: numeric
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: loaded_on
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: rifle
                  type: uuid
              - column:
                  name: notes
                  type: text
        - addUniqueConstraint:
            tableName: load
            columnNames: id, owner
            constraintName: uk_load_id_owner
            validate: true
        - sql:
            comment: "the referenced rows must belong to the same owner"
            sql: >
              ALTER TABLE load
                ADD CONSTRAINT fk_load_processed_case
                  FOREIGN KEY (processed_case, owner) REFERENCES processed_case (id, owner),
                ADD CONSTRAINT fk_load_bullet_lot
                  FOREIGN KEY (bullet_lot, owner) REFERENCES bullet_lot (id, owner),
                ADD CONSTRAINT fk_load_powder_lot
                  FOREIGN KEY (powder_lot, owner) REFERENCES powder_lot (id, owner),
                ADD CONSTRAINT fk_load_primer_lot
                  FOREIGN KEY (primer_lot, owner) REFERENCES primer_lot (id, owner),
                ADD CONSTRAINT fk_load_rifle
                  FOREIGN KEY (rifle, owner) REFERENCES rifle (id, owner);
        - sql:
            sql: >
              ALTER TABLE load
                ADD CONSTRAINT ck_load_powder_charge
                  CHECK (powder_charge > 0),
                ADD CONSTRAINT ck_load_overall_length
                  CHECK (overall_length > 0),
                ADD CONSTRAINT ck_load_base_to_ogive
                  CHECK (base_to_ogive > 0),
                ADD CONSTRAINT ck_load_quantity
                  CHECK (quantity > 0);
