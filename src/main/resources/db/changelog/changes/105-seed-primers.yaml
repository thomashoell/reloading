                ('Winchester', 'WLRM', 'LARGE_RIFLE_MAGNUM'),
                ('Winchester', 'WSP', 'SMALL_PISTOL'),
                ('Winchester', 'WLP', 'LARGE_PISTOL'),
                ('RWS', '4033', 'SMALL_RIFLE'),
                ('RWS', '5341', 'LARGE_RIFLE'),
                ('RWS', '5333', 'LARGE_RIFLE_MAGNUM'),
                ('RWS', '4031', 'SMALL_PISTOL'),
