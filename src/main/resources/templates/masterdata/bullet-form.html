<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Geschoss')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 40rem">
    <h1 class="h3 mb-3">Geschoss</h1>
    <form method="post" th:action="@{${action}}" th:object="${form}" novalidate>
        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="message : ${#fields.globalErrors()}" th:text="${message}">Fehler</div>
        </div>
        <div class="mb-3">
            <label for="manufacturer" class="form-label">Hersteller</label>
            <select id="manufacturer" class="form-select" th:field="*{manufacturer}"
                    th:classappend="${#fields.hasErrors('manufacturer')} ? 'is-invalid'">
                <option value="">Bitte wählen</option>
                <option th:each="m : ${manufacturers}" th:value="${m.id}" th:text="${m.name}">Hersteller</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('manufacturer')}" th:errors="*{manufacturer}">Fehler</div>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Bezeichnung</label>
            <input type="text" id="name" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Fehler</div>
        </div>
        <div class="mb-3">
            <label for="diameter" class="form-label">Durchmesser</label>
            <div class="input-group has-validation">
                <input type="number" step="any" min="0" id="diameter" class="form-control" th:field="*{diameter}"
                       th:classappend="${#fields.hasErrors('diameter')} ? 'is-invalid'">
                <span class="input-group-text" th:text="${user.lengthUnit.symbol}">mm</span>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('diameter')}" th:errors="*{diameter}">Fehler</div>
            </div>
        </div>
        <div class="mb-3">
            <label for="weight" class="form-label">Gewicht</label>
            <div class="input-group has-validation">
                <input type="number" step="any" min="0" id="weight" class="form-control" th:field="*{weight}"
                       th:classappend="${#fields.hasErrors('weight')} ? 'is-invalid'">
                <span class="input-group-text" th:text="${user.weightUnit.symbol}">gr</span>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}">Fehler</div>
            </div>
        </div>
        <div class="mb-3">
            <label for="length" class="form-label">Länge (optional)</label>
            <div class="input-group has-validation">
                <input type="number" step="any" min="0" id="length" class="form-control" th:field="*{length}"
                       th:classappend="${#fields.hasErrors('length')} ? 'is-invalid'">
                <span class="input-group-text" th:text="${user.lengthUnit.symbol}">mm</span>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('length')}" th:errors="*{length}">Fehler</div>
            </div>
        </div>
        <p class="form-text">Die Einheiten richten sich nach deinen <a th:href="@{/settings}">Einstellungen</a>.</p>
        <button type="submit" class="btn btn-primary">Speichern</button>
        <a class="btn btn-link" th:href="@{/bullets}">Abbrechen</a>
    </form>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
