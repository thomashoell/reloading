<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hülsen')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Hülsen</h1>
        <a th:if="${user.admin}" class="btn btn-primary" th:href="@{/casings/new}">Neu anlegen</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <p th:if="${#lists.isEmpty(casings)}" class="text-secondary">Noch keine Einträge vorhanden.</p>
    <table th:unless="${#lists.isEmpty(casings)}" class="table table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Hersteller</th>
            <th scope="col">Kaliber</th>
            <th scope="col" th:if="${user.admin}" class="text-end">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${casings}">
            <td th:text="${row.manufacturer}">manufacturer</td>
            <td th:text="${row.caliber}">caliber</td>
            <td th:if="${user.admin}" class="text-end">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/casings/{id}/edit(id=${row.id})}">Bearbeiten</a>
                <form class="d-inline" method="post" th:action="@{/casings/{id}/delete(id=${row.id})}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
