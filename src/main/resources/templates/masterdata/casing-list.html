<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hülsen')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Hülsen</h1>
    <p class="text-secondary">Stammdaten sind fest vorgegeben. Fehlt ein Eintrag, kommt er mit einer neuen Version der Anwendung.</p>
    <form method="get" th:action="@{/casings}" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label for="manufacturer" class="form-label">Hersteller</label>
            <select id="manufacturer" name="manufacturer" class="form-select">
                <option value="">Alle</option>
                <option th:each="option : ${manufacturers}" th:value="${option.id}" th:text="${option.name}"
                        th:selected="${option.id == selectedManufacturer}">Eintrag</option>
            </select>
        </div>
        <div class="col-auto">
            <label for="caliber" class="form-label">Kaliber</label>
            <select id="caliber" name="caliber" class="form-select">
                <option value="">Alle</option>
                <option th:each="option : ${calibers}" th:value="${option.id}" th:text="${option.name}"
                        th:selected="${option.id == selectedCaliber}">Eintrag</option>
            </select>
        </div>
        <div th:replace="~{fragments/layout :: pagesize(${page})}"></div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Filtern</button>
            <a class="btn btn-link" th:href="@{/casings}">Zurücksetzen</a>
        </div>
    </form>
    <p th:if="${page.empty}" class="text-secondary">Keine Einträge gefunden.</p>
    <table th:unless="${page.empty}" class="table table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Hersteller</th>
            <th scope="col">Kaliber</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${page.items}">
            <td th:text="${row.manufacturer}">manufacturer</td>
            <td th:text="${row.caliber}">caliber</td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/layout :: pagination(${page})}"></div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
