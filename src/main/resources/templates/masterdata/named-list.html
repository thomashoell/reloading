<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${title}">Hersteller</h1>
        <a th:if="${user.admin}" class="btn btn-primary" th:href="@{|${path}/new|}">Neu anlegen</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <p th:if="${#lists.isEmpty(items)}" class="text-secondary">Noch keine Einträge vorhanden.</p>
    <table th:unless="${#lists.isEmpty(items)}" class="table table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col" th:if="${user.admin}" class="text-end">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}">Name</td>
            <td th:if="${user.admin}" class="text-end">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{|${path}/${item.id}/edit|}">Bearbeiten</a>
                <form class="d-inline" method="post" th:action="@{|${path}/${item.id}/delete|}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
